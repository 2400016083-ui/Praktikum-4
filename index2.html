<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center">

    <div class="text-center">

        <h1 class="text-3xl font-bold text-blue-600 mb-3 text-center">
            Hello World
        </h1>

        <p class="mb-4 text-gray-700">ini harusnya teks</p>

        <button class="px-4 py-2 border rounded-lg mb-6 bg-white shadow">
            Pencet Disini Yaa
        </button>

        <div class="flex items-center justify-center gap-4">
            <button id="minus" class="px-4 py-2 border rounded-lg bg-white shadow">-</button>
            
            <span id="count" class="text-xl font-semibold">0</span>

            <button id="plus" class="px-4 py-2 border rounded-lg bg-white shadow">+</button>
        </div>

    </div>

<script>
    let count = 0;

    const countDisplay = document.getElementById("count");
    const plusBtn = document.getElementById("plus");
    const minusBtn = document.getElementById("minus");

    plusBtn.addEventListener("click", () => {
        count++;
        countDisplay.textContent = count;
    });

    minusBtn.addEventListener("click", () => {
        count--;
        countDisplay.textContent = count;
    });
</script>

</body>
</html>
