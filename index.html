<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Useless Facts</title>

  
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

  <div class="text-center px-6">

    <h1 class="text-3xl font-bold text-orange-400 flex items-center justify-center gap-2 mb-4">
      🤔 Random Useless Facts
    </h1>

    
    <p id="fact" class="text-lg text-gray-700 mb-6">
      Klik tombolnya buat dapat fakta acak.
    </p>

  
    <button id="btn"
      class="px-6 py-3 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
      Get Another Random Fact
    </button>
  </div>

  <script>
    const facts = [
      "Etaa kembaran monyett",
      "Lumba-lumba tidur dengan satu mata terbuka.",
      "masa gitu aja gatausihh.",
      "Kelinci tidak bisa muntah.",
      "varsi gamau disinisin orang jelek.",
      "Kucing punya 32 otot hanya untuk menggerakkan telinga."
    ];

    const factText = document.getElementById("fact");
    const btn = document.getElementById("btn");

    btn.addEventListener("click", () => {
      const random = facts[Math.floor(Math.random() * facts.length)];
      factText.textContent = random;
    });
  </script>

</body>
</html>
